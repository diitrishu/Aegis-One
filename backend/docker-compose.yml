# Default stack: everything the app needs, nothing to configure.
#     docker compose up --build        (from backend/)   ->  http://localhost:3000
#
# The legacy QGIS Server / OSRM / PostGIS stack is still available under the
# "legacy" profile:  docker compose --profile legacy up   (needs backend/.env, see .env.example)
services:
  api:
    build: { context: .., dockerfile: backend/Dockerfile.api }
    command: python simple_disaster_api.py
    ports: ["5000:5000"]
    environment:
      - GPKG_WORK_PATH=/tmp/up_india.gpkg
    restart: unless-stopped

  routing:
    build: { context: .., dockerfile: backend/Dockerfile.routing }
    ports: ["8082:8082"]
    restart: unless-stopped

  wms:
    build: { context: .., dockerfile: backend/Dockerfile.api }
    command: python wms_server.py
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
    restart: unless-stopped

  tracking:
    build: { context: .., dockerfile: backend/Dockerfile.api }
    command: python location_tracking_api.py
    ports: ["5052:5052"]
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build: { context: ../frontend }
    ports: ["3000:3000"]
    environment:
      - BACKEND_URL=http://api:5000
    depends_on: [api, routing, wms]
    restart: unless-stopped

  # ---- legacy services (optional) -----------------------------------------
  qgis-server:
    profiles: [legacy]
    build: .
    user: "0:0"
    environment:
      - QGIS_PROJECT_FILE=/io/data/working_project.qgs
    volumes:
      - ./data:/io/data:rw
      - ./plugins:/io/plugins:ro
    ports: ["8090:80"]

  postgres:
    profiles: [legacy]
    image: postgis/postgis:15-3.3
    ports: ["5432:5432"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-disaster_response}
      - POSTGRES_USER=${POSTGRES_USER:-disaster_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
