<!DOCTYPE html>
<html>

<head>
    <title>API Test - Disaster Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #4f7cff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #3d6ae0;
        }

        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Disaster API Test</h1>

    <h2>Test 1: Fetch All Disasters</h2>
    <button onclick="testDisasters()">Test /api/disasters</button>
    <div id="result1"></div>

    <h2>Test 2: Fetch Status</h2>
    <button onclick="testStatus()">Test /api/status</button>
    <div id="result2"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function testDisasters() {
            const resultDiv = document.getElementById('result1');
            resultDiv.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch(`${API_URL}/disasters`);
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p class="success">✅ Success!</p>
                    <p><strong>Found ${data.disasters ? data.disasters.length : 0} disasters</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Error: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        async function testStatus() {
            const resultDiv = document.getElementById('result2');
            resultDiv.innerHTML = '<p>Loading...</p>';

            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p class="success">✅ Success!</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Error: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
    <script src="js/i18n.js"></script>
</body>

</html>
